[project]
name = "diane"
version = "0.1.0"
description = "Diane — fully local, privacy-first voice assistant (JARVIS-LOCAL handbook)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "janus>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "ollama>=0.3",
    "piper-tts>=1.2",
    "mss>=9.0",
    "pillow>=10.0",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
avatar = ["PySide6>=6.6", "qasync>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-qt>=4.4", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]
