[project]
name = "diane"
version = "0.1.0"
description = "Diane — fully local, privacy-first voice assistant (JARVIS-LOCAL handbook)"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "janus>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    # openwakeword is installed separately with --no-deps (setup.md): 0.6.0
    # hard-requires tflite-runtime, which has no Python 3.12 wheels, so listing
    # it here made `pip install -e .` fail on a fresh machine. Its runtime deps:
    "scipy>=1.3",
    "scikit-learn>=1",
    "tqdm>=4",
    "requests>=2",
    "faster-whisper>=1.0",
    "ollama>=0.3",
    "piper-tts>=1.2",
    "mss>=9.0",
    "pillow>=10.0",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
avatar = ["PySide6>=6.6", "qasync>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-qt>=4.4", "ruff>=0.4"]
train = ["skl2onnx>=1.16"]  # scripts/train_wakeword/

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule set: newer ruff releases widen the default selection, which
# made CI (latest ruff) fail on code that passes locally. Pin what we enforce.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jarvis"]
